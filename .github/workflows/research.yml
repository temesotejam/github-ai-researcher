name: AI Research

on:
  workflow_dispatch:
    inputs:
      max_repos:
        description: Maximum number of repositories to profile in this run
        required: false
        default: 120
        type: number
      force_profiles:
        description: Re-analyze repositories even when their source has not changed
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "17 0 * * 1"
  push:
    branches: [main]
    paths:
      - ".github/workflows/research.yml"
      - "scripts/research.mjs"

permissions:
  contents: write
  copilot-requests: write

concurrency:
  group: github-ai-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Validate JavaScript syntax
        run: node --check scripts/research.mjs

      - name: Install GitHub Copilot CLI
        run: npm install -g @github/copilot

      - name: Analyze public repositories
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RESEARCH_OWNER: temesotejam
          MAX_REPOS: ${{ github.event.inputs.max_repos || 120 }}
          FORCE_PROFILES: ${{ github.event.inputs.force_profiles || 'false' }}
        run: node scripts/research.mjs

      - name: Commit research results
        run: |
          if git diff --quiet -- data/profiles.json data/repository-index.json reports; then
            echo "No research output changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/profiles.json data/repository-index.json reports
          git commit -m "research: update public repository analysis"
          git fetch origin main
          git rebase origin/main
          git push origin main
