name: Deploy Research Dashboard

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "data/**"
      - "reports/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare static site
        run: |
          rm -rf public
          mkdir -p public/data public/reports
          cp -R docs/. public/
          cp data/profiles.json data/repository-index.json public/data/
          cp reports/latest.md public/reports/latest.md
          if [ -d reports/weekly ]; then
            cp -R reports/weekly public/reports/weekly
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
